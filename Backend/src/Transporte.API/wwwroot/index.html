    <!-- Script de diagnóstico de arranque offline para prevenir pantallas blancas -->
    <script>
      window.addEventListener('error', function(e) {
        console.warn('Startup Notice (tolerante):', e.message);
        var txt = document.getElementById('pwa-splash-text');
        if (txt) {
          txt.innerHTML = 'Cargando memoria local offline...';
        }
      });
    </script>


    <!-- Registro inmediato de Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              // Si hay nueva versión esperando, actualizar
              reg.onupdatefound = () => {
                const installing = reg.installing;
                if (installing) {
                  installing.onstatechange = () => {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[SW] Nueva versión de Rutas Móvil lista.');
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn('[SW] Error registro:', err);
            });
        });
      }
